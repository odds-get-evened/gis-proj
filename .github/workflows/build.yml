name: build and release NYS GIS app

on:
  push:
    tags:
      # triggers the build automatically when you push a version tag
      - 'v*'
  workflow_dispatch: # Allows manual trigger from the GitHub Actions tab

permissions:
  contents: write # Grants permission to create and publish releases

jobs:
  release:
    name: Build Installer on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install fastapi uvicorn requests pydantic pyinstaller

      - name: Compile Python Backend
        run: |
          pyinstaller --onedir --clean --name=gis-backend main.py

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: gis-frontend/package.json

      - name: Install Node.js Dependencies
        run: |
          cd gis-frontend
          npm install

      - name: Build Electron App Installers
        run: |
          cd gis-frontend
          npx electron-builder --publish never

      - name: Create and Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          files: |
            gis-frontend/dist-installer/*.dmg
            gis-frontend/dist-installer/*.zip
            gis-frontend/dist-installer/*.exe
            gis-frontend/dist-installer/*.AppImage
            gis-frontend/dist-installer/*.deb
            gis-frontend/dist-installer/*.yml
            gis-frontend/dist-installer/*.blockmap
          fail_on_unmatched_files: false
          generate_release_notes: true
